# SonarQube Project Configuration
# https://docs.sonarsource.com/sonarqube/latest/project-administration/narrowing-the-focus/

sonar.projectKey=inventory-management-ssdd-final
sonar.projectName=InventoryHub
sonar.projectVersion=1.0.0

# Path to the source directories (comma-separated)
sonar.sources=server.js,src

# Path to the test directories (comma-separated)
sonar.tests=server.test.js

# Language settings
sonar.language=js
sonar.sourceEncoding=UTF-8

# Exclude dependencies, coverage reports, documentation, and config from analysis
sonar.exclusions=node_modules/**,coverage/**,reports/**,docs/**,docker/**,k8s/**
