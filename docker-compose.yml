services:
  mongo:
    image: mongo:7
    container_name: inventoryhub-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-adminpassword}
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: inventoryhub-redis
    ports:
      - "6379:6379"

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: inventoryhub-zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:latest
    container_name: inventoryhub-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CREATE_TOPICS=inventory-events:1:1
    depends_on:
      - zookeeper

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: inventoryhub-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - APP_NAME=InventoryHub
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-adminpassword}@mongo:27017/inventoryhub?authSource=admin
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-adminpassword}@mongo:27017/inventoryhub?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_me_in_production}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:3000}
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - mongo
      - redis
      - kafka

volumes:
  mongo-data:
