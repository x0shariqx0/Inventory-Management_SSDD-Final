apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-hub-deployment
  labels:
    app: inventory-hub
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inventory-hub
  template:
    metadata:
      labels:
        app: inventory-hub
    spec:
      containers:
        - name: inventory-hub
          image: x0shariqx0/inventory-hub:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3000"
            - name: APP_NAME
              value: "InventoryHub"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: inventory-hub-secrets
                  key: MONGO_URI
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: inventory-hub-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: inventory-hub-secrets
                  key: JWT_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-hub-secrets
                  key: REDIS_URL
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: inventory-hub-secrets
                  key: KAFKA_BROKER
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20