apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-hub-deployment
  labels:
    app: inventory-hub
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app: inventory-hub
  template:
    metadata:
      labels:
        app: inventory-hub
    spec:
      containers:
        - name: inventory-hub
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "{{ .Values.app.port }}"
            - name: APP_NAME
              value: "InventoryHub"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: MONGO_URI
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: JWT_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: REDIS_URL
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: REDIS_PASSWORD
            - name: REDIS_USE_TLS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: REDIS_USE_TLS
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: KAFKA_BROKER
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: KAFKA_SASL_USERNAME
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: KAFKA_SASL_PASSWORD
            - name: KAFKA_USE_SSL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: KAFKA_USE_SSL
            - name: OIDC_ISSUER
              value: "https://identity.inventoryhub.local/oauth2/default"
            - name: OIDC_AUDIENCE
              value: "inventory-hub-api"
          resources:
            requests:
              cpu: {{ .Values.app.resources.requests.cpu | quote }}
              memory: {{ .Values.app.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.app.resources.limits.cpu | quote }}
              memory: {{ .Values.app.resources.limits.memory | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 20
            periodSeconds: 20